<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Collapsed decision bar</title>
<link rel="stylesheet" href="style.css">
<style>html, body { width: 825px; } #shot { padding-top: 92px; }</style>
</head>
<body>
<div id="shot">
  <div class="bar collapsed">
    <span class="btn toggle">Decisions</span>
    <span class="summary">Dark mode<span class="mark on"></span><span class="sep">·</span>Decaf ✗ ✎<span class="sep">·</span>Auth<span class="mark on"></span><span class="sep">·</span>Easter egg<span class="mark"></span></span>
    <span class="btn primary">Send all</span>
  </div>
  <div class="prompt"><span class="plus">+</span>Type / for commands<svg class="mic" viewBox="0 0 16 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="5" y="1" width="6" height="10" rx="3"/><path d="M2.5 8.5a5.5 5.5 0 0 0 11 0M8 14v3"/></svg></div>
</div>
</body>
</html>
